name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: test -z "$(go fmt ./...)"
      - run: go vet ./...
      - run: bash -o pipefail -c 'go test ./... 2>&1 | tee test-output.log'
        id: unit-tests
      - run: ./scripts/visual-test-report.sh test-output.log test-report.html
        if: steps.unit-tests.outcome == 'success' || steps.unit-tests.outcome == 'failure'
      - uses: actions/upload-artifact@v4
        if: steps.unit-tests.outcome == 'success' || steps.unit-tests.outcome == 'failure'
        with:
          name: test-report
          path: test-report.html

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    permissions:
      contents: read
      actions: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: standard_tools
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SQT_DATABASE_URL: postgres://postgres:postgres@localhost:5432/standard_tools?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: bash -o pipefail -c 'go test ./... -tags integration -race 2>&1 | tee test-integration.log'
        id: integration-tests
        if: success() || failure()
      - run: ./scripts/visual-test-report.sh test-integration.log test-report-integration.html
        if: steps.integration-tests.outcome == 'success' || steps.integration-tests.outcome == 'failure'
      - uses: actions/upload-artifact@v4
        if: steps.integration-tests.outcome == 'success' || steps.integration-tests.outcome == 'failure'
        with:
          name: test-report-integration
          path: test-report-integration.html

  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: integration
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y podman
      # vfs is used because overlay requires additional kernel/user-namespace
      # configuration that is not guaranteed on the GitHub Actions Ubuntu runner.
      - name: Configure podman
        run: |
          sudo mkdir -p /etc/containers /var/lib/containers/storage /run/containers/storage
          printf 'unqualified-search-registries = ["docker.io"]\n' | sudo tee /etc/containers/registries.conf
          printf '[storage]\ndriver = "vfs"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' | sudo tee /etc/containers/storage.conf
      - run: sudo podman build -f Dockerfile -t standard-tools-go:latest .
      - run: sudo podman build -f Dockerfile.native -t standard-tools-go:native .
      - name: Smoke test classic image
        run: |
          sudo podman run -d -p 8080:8080 --name stg-classic standard-tools-go:latest
          success=0
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health; then
              success=1
              break
            fi
            sleep 1
          done
          sudo podman rm -f stg-classic
          if [ "$success" -ne 1 ]; then
            echo "Classic image health check failed" >&2
            exit 1
          fi
      - name: Smoke test native image
        run: |
          sudo podman run -d -p 8080:8080 --name stg-native standard-tools-go:native
          success=0
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health; then
              success=1
              break
            fi
            sleep 1
          done
          sudo podman rm -f stg-native
          if [ "$success" -ne 1 ]; then
            echo "Native image health check failed" >&2
            exit 1
          fi
