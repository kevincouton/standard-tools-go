[tools]
go = "1.25"
act = "0.2.75"
podman = "5.2.0"

[tasks]
build = "go build ./cmd/server && go build ./cmd/cli"
test = "bash -o pipefail -c 'go test ./... 2>&1 | tee test-output.log && ./scripts/visual-test-report.sh test-output.log test-report.html'"
test-integration = "go test ./... -tags integration -race"
fmt = "go fmt ./..."
vet = "go vet ./..."
run = "go run ./cmd/server"
image = "podman build -f Dockerfile -t standard-tools-go:latest ."
image-native = "podman build -f Dockerfile.native -t standard-tools-go:native ."
act = "./scripts/run-act-local.sh"
